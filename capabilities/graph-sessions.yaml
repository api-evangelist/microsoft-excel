naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Excel API — Sessions
  description: 'Microsoft Graph Excel API — Sessions. 1 operations. Lead operation: Microsoft Excel Create Workbook Session.
    Self-contained Naftiko capability covering one Microsoft Excel business surface.'
  tags:
  - Microsoft Excel
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_EXCEL_API_KEY: MICROSOFT_EXCEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-sessions
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Excel API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: me-drive-items-item-id-workbook-createSession
      path: /me/drive/items/{item-id}/workbook/createSession
      operations:
      - name: createworkbooksession
        method: POST
        description: Microsoft Excel Create Workbook Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: item-id
          in: path
          type: string
          description: The ID of the workbook file in OneDrive.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_EXCEL_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-sessions-rest
    port: 8080
    description: REST adapter for Microsoft Graph Excel API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/drive/items/{item-id}/workbook/createsession
      name: me-drive-items-item-id-workbook-createsession
      description: REST surface for me-drive-items-item-id-workbook-createSession.
      operations:
      - method: POST
        name: createworkbooksession
        description: Microsoft Excel Create Workbook Session
        call: graph-sessions.createworkbooksession
        with:
          item-id: rest.item-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Excel API — Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-excel-create-workbook-session
      description: Microsoft Excel Create Workbook Session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-sessions.createworkbooksession
      with:
        item-id: tools.item-id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

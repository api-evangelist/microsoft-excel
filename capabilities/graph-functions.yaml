naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Excel API — Functions
  description: 'Microsoft Graph Excel API — Functions. 1 operations. Lead operation: Microsoft Excel Call Workbook Function.
    Self-contained Naftiko capability covering one Microsoft Excel business surface.'
  tags:
  - Microsoft Excel
  - Functions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_EXCEL_API_KEY: MICROSOFT_EXCEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-functions
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Excel API — Functions business capability. Self-contained, no shared references.
    resources:
    - name: me-drive-items-item-id-workbook-functions-function-name
      path: /me/drive/items/{item-id}/workbook/functions/{function-name}
      operations:
      - name: callworkbookfunction
        method: POST
        description: Microsoft Excel Call Workbook Function
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: item-id
          in: path
          type: string
          description: The ID of the workbook file.
          required: true
        - name: function-name
          in: path
          type: string
          description: The name of the Excel function to call.
          required: true
        - name: workbook-session-id
          in: header
          type: string
          description: Workbook session ID.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_EXCEL_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-functions-rest
    port: 8080
    description: REST adapter for Microsoft Graph Excel API — Functions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/drive/items/{item-id}/workbook/functions/{function-name}
      name: me-drive-items-item-id-workbook-functions-function-name
      description: REST surface for me-drive-items-item-id-workbook-functions-function-name.
      operations:
      - method: POST
        name: callworkbookfunction
        description: Microsoft Excel Call Workbook Function
        call: graph-functions.callworkbookfunction
        with:
          item-id: rest.item-id
          function-name: rest.function-name
          workbook-session-id: rest.workbook-session-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-functions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Excel API — Functions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-excel-call-workbook-function
      description: Microsoft Excel Call Workbook Function
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-functions.callworkbookfunction
      with:
        item-id: tools.item-id
        function-name: tools.function-name
        workbook-session-id: tools.workbook-session-id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

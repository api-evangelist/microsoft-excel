  registry: powershell-gallery
  name: Microsoft.Graph
  url: https://www.powershellgallery.com/packages/Microsoft.Graph
  install: Install-Module Microsoft.Graph -Scope CurrentUser
  repo: https://github.com/microsoftgraph/msgraph-sdk-powershell
  official: true
- language: cli
  registry: github-releases
  name: msgraph-cli (mgc)
  url: https://github.com/microsoftgraph/msgraph-cli
  install: "download from https://aka.ms/get/graphcli/latest/<platform>.zip"
